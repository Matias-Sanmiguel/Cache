spring:
  application:
    name: cache-backend

  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD}

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/cache_db}
      # crea los índices anotados (@Indexed, @CompoundIndex, @GeoSpatialIndexed) al iniciar
      auto-index-creation: true

    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

    cassandra:
      contact-points: ${CASSANDRA_CONTACT_POINTS:localhost}
      port: 9042
      keyspace-name: ${CASSANDRA_KEYSPACE:cache_ks}
      local-datacenter: ${CASSANDRA_DC:datacenter1}
      username: ${CASSANDRA_USER:cassandra}
      password: ${CASSANDRA_PASSWORD}
      schema-action: create-if-not-exists

# config propia de la app (auth + cors)
app:
  jwt:
    # secreto HS256 — DEBE tener al menos 32 bytes. en prod viene de JWT_SECRET
    secret: ${JWT_SECRET:dev-secret-cambiar-en-prod-min-32-bytes-larguisimo}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

server:
  port: ${SPRING_PORT:8080}

logging:
  level:
    com.cache: DEBUG
    org.springframework.data: WARN
